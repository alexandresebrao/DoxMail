# DoxMail Flatpak: builds doxmail/flatpak/org.doxia.DoxMail.json and
# publishes it as a signed Flatpak repository on GitHub Pages
# (https://alexandresebrao.github.io/DoxMail/doxmail.flatpakrepo).
# Run by doxmail/release (gh workflow run) on the doxmail branch.
name: DoxMail Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doxmail-flatpak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the manifest builds the committed doxmail branch of this checkout
      - name: Local doxmail branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git branch -f doxmail HEAD

      - uses: actions/cache@v4
        with:
          path: _flatpak/state
          key: flatpak-builder-${{ hashFiles('doxmail/flatpak/*') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-${{ hashFiles('doxmail/flatpak/*') }}-
            flatpak-builder-

      - name: Signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --ccache --state-dir=_flatpak/state \
            --gpg-sign="$GPG_KEY" --repo=_flatpak/repo \
            _flatpak/build doxmail/flatpak/org.doxia.DoxMail.json

      - name: Repository
        run: |
          flatpak build-update-repo --gpg-sign="$GPG_KEY" \
            --title="DoxMail" --default-branch=master \
            --generate-static-deltas --prune _flatpak/repo
          site=_flatpak/site
          mkdir -p "$site"
          cp -a _flatpak/repo "$site/repo"
          key=$(base64 -w0 doxmail/flatpak/doxmail-repo.gpg)
          url=https://alexandresebrao.github.io/DoxMail
          printf '%s\n' "[Flatpak Repo]" "Title=DoxMail" "Url=$url/repo/" \
            "Homepage=https://github.com/alexandresebrao/DoxMail" \
            "Comment=DoxMail, the DoxIA mail client" "GPGKey=$key" \
            > "$site/doxmail.flatpakrepo"
          printf '%s\n' "[Flatpak Ref]" "Name=org.doxia.DoxMail" "Branch=master" \
            "Title=DoxMail" "Url=$url/repo/" "SuggestRemoteName=doxmail" \
            "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo" \
            "IsRuntime=false" "GPGKey=$key" \
            > "$site/org.doxia.DoxMail.flatpakref"
          git log -1 --format='DoxMail %h (%cs)' > "$site/version.txt"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _flatpak/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
